name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  OPENSPEC_TELEMETRY: '0'

jobs:
  title:
    name: ${{ github.event_name == 'pull_request' && 'PR title and docs' || 'Docs classification' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.docs.outputs.docs_only }}
    steps:
      - name: Conventional PR title
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            docs
            build
            ci
            refactor
            style
            test
            chore
            revert
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Documentation paths (including both sides of renames)
        id: paths
        uses: dorny/paths-filter@v4.0.3
        with:
          base: ${{ github.ref }}
          predicate-quantifier: every
          filters: |
            non_docs:
              - '!README.md'
              - '!AGENTS.md'
              - '!CONTRIBUTING.md'
              - '!docs/**/*.md'
              - '!docs/**/*.png'
              - '!docs/**/*.svg'
              - '!openspec/specs/**/*.md'
              - '!openspec/changes/**/*.md'
            non_proposal_docs:
              - '!README.md'
              - '!AGENTS.md'
              - '!CONTRIBUTING.md'
              - '!docs/**/*.md'
              - '!docs/**/*.png'
              - '!docs/**/*.svg'
              - '!openspec/specs/**/*.md'
              - '!openspec/changes/**/*.md'
              - '!openspec/changes/*/.openspec.yaml'
      - name: Apply docs-only exception
        id: docs
        uses: actions/github-script@v9.0.0
        env:
          NON_DOCS: ${{ steps.paths.outputs.non_docs }}
          NON_PROPOSAL_DOCS: ${{ steps.paths.outputs.non_proposal_docs }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const title = (pr?.title ?? context.payload.head_commit?.message ?? '').split('\n')[0];
            const docs = /^docs(?:\([^()]+\))?!?: /.test(title);
            const proposal = pr?.labels.some(label => label.name === 'openspec:proposal-only');
            const nonDocs = proposal ? process.env.NON_PROPOSAL_DOCS : process.env.NON_DOCS;
            if (docs && (title.split(':')[0].endsWith('!') || nonDocs !== 'false')) {
              core.setFailed('docs PRs cannot be breaking or change code, dependencies or workflows.');
            }
            core.setOutput('docs_only', docs && nonDocs === 'false');

  python:
    name: Python checks
    needs: title
    if: needs.title.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.13.0'
          enable-cache: true
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check backend/app.py backend/models.py backend/storage.py backend/songs.py backend/planning.py backend/arrangement.py backend/guide_enhance.py backend/prompt_enrichment.py backend/inference_runner.py backend/timing.py backend/folders.py backend/updates.py backend/credentials.py backend/instance.py backend/library_actions.py scripts backend/tests
      - run: uv run --locked ty check
      - run: uv run --locked pytest

  angular:
    name: Angular checks
    needs: title
    if: needs.title.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:frontend
      - run: npm run build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: angular-dist
          path: frontend/dist/browser/
          if-no-files-found: error
          retention-days: 7

  integration:
    name: Integration and specs
    needs: [title, python, angular]
    if: >-
      always() && needs.title.result == 'success' &&
      (needs.title.outputs.docs_only == 'true' ||
      (needs.python.result == 'success' && needs.angular.result == 'success'))
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ needs.title.outputs.docs_only }}
    env:
      TROGLODAW_LIBRARY: ${{ github.workspace }}/.tools/troglodaw-integration-library
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --workspaces=false
      - run: npm test
      - run: npm run specs:check
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.13.0'
          enable-cache: true
          python-version: '3.12'
      - run: uv run --no-project python scripts/check_specs.py
      - if: needs.title.outputs.docs_only != 'true'
        run: uv sync --locked
      - if: needs.title.outputs.docs_only != 'true'
        run: uv run --locked python backend/cli.py demo
      - if: needs.title.outputs.docs_only != 'true'
        run: uv run --locked python scripts/smoke_producer.py

  build:
    name: Windows build and installed app
    needs: integration
    if: needs.integration.outputs.docs_only != 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      TROGLODAW_VERSION: '0.0.0'
      TROGLODAW_LIBRARY: ${{ github.workspace }}/.tools/troglodaw-installed-library
      PLAYWRIGHT_CHANNEL: msedge
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.13.0'
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --workspaces=false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: angular-dist
          path: frontend/dist/browser/
      - name: Install NSIS
        run: choco install nsis --version=3.11.0 -y --no-progress
      - name: Select native NSIS compiler
        run: |
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
          if (-not (Test-Path -LiteralPath $nsis)) { throw 'Native NSIS compiler missing' }
          "TROGLODAW_MAKENSIS=$($nsis.Replace('\', '/'))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Stage locked runtime and build EXE
        shell: bash
        run: bash scripts/windows/build.sh
      - name: Install and test EXE
        run: ./scripts/windows/test_installer.ps1
      - name: Exercise final-release smoke checks on preview EXE
        run: ./scripts/windows/test_installer.ps1 -ReleaseSmoke
      - name: Archive checked payload for release preparation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: tar -czf dist/payload.tar.gz -C scripts/windows/work/stage/TrogloDAW .
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-build
          path: |
            dist/TrogloDAW-Setup-0.0.0.exe
            dist/SHA256SUMS
            dist/release.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: release-payload
          path: dist/payload.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: installed-app-failure-traces
          path: test-results/

  release:
    name: Semantic release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TROGLODAW_LIBRARY: ${{ github.workspace }}/.tools/troglodaw-release-library
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --workspaces=false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-payload
          path: dist/
      - name: Restore checked payload
        run: |
          New-Item -ItemType Directory -Force scripts/windows/work/stage/TrogloDAW | Out-Null
          tar -xzf dist/payload.tar.gz -C scripts/windows/work/stage/TrogloDAW
          if ($LASTEXITCODE) { throw 'Payload extraction failed' }
      - name: Require published release history
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, context.repo);
            const published = new Set(releases.filter(r => !r.draft && !r.prerelease).map(r => r.tag_name));
            const {stdout} = await exec.getExecOutput('git', ['tag', '--merged', 'HEAD', '--list', 'v*']);
            for (const tag of stdout.trim().split('\n').filter(t => /^v\d+\.\d+\.\d+$/.test(t))) {
              if (!published.has(tag)) core.setFailed(`Repair the unpublished ${tag} release before continuing; its commits must stay in the changelog.`);
            }
      - run: choco install nsis --version=3.11.0 -y --no-progress
      - name: Select native NSIS compiler
        run: |
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
          if (-not (Test-Path -LiteralPath $nsis)) { throw 'Native NSIS compiler missing' }
          "TROGLODAW_MAKENSIS=$($nsis.Replace('\', '/'))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Version, test, tag and publish with semantic-release
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
