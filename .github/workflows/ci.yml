name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  OPENSPEC_TELEMETRY: '0'

jobs:
  policy:
    name: PR policy
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.policy.outputs.docs_only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - id: policy
        run: python scripts/check_policy.py
      - run: python scripts/check_specs.py

  tooling:
    name: Tooling and specs
    runs-on: ubuntu-latest
    needs: policy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run specs:check

  quality:
    name: Python (${{ matrix.os }})
    needs: policy
    if: needs.policy.outputs.docs_only != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      MM_LIBRARY: ${{ github.workspace }}/.tools/musicmaker-test-library
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.0
      - run: uv sync --locked
      - run: uv lock --check
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check backend/app.py scripts backend/tests
      - run: uv run --locked ty check
      - run: uv run --locked python -m pytest
      - run: uv run --locked python backend/cli.py demo
      - run: uv run --locked python scripts/smoke_producer.py

  frontend:
    name: Angular checks and browser parity
    runs-on: ubuntu-latest
    needs: policy
    if: needs.policy.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install uv==0.13.0
      - run: uv sync --locked
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:frontend
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failure-traces
          path: test-results/

  plan:
    name: Release plan
    runs-on: ubuntu-latest
    needs: policy
    if: needs.policy.outputs.docs_only != 'true'
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - id: plan
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo 'version=0.0.0' >> "$GITHUB_OUTPUT"
          else
            npm run release:plan
          fi

  installer:
    name: Windows installer
    runs-on: ubuntu-latest
    needs: [policy, tooling, quality, frontend, plan]
    if: needs.policy.outputs.docs_only != 'true' && needs.plan.outputs.version != ''
    env:
      MM_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Install build tools
        run: |
          python -m pip install uv==0.13.0
          uv sync --locked
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: bash scripts/windows/build.sh
      - run: python scripts/build_manifest.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installer
          path: dist/
          if-no-files-found: error
          retention-days: 7

  windows-smoke:
    name: Windows installation smoke test
    runs-on: windows-latest
    needs: installer
    timeout-minutes: 20
    env:
      MM_LIBRARY: ${{ github.workspace }}/.tools/musicmaker-smoke-library
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-installer
          path: dist
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright install chromium
      - name: Install and exercise embedded runtime
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP 'MusicMaker'
          $installer = Start-Process -FilePath ./dist/MusicMaker-Setup.exe -ArgumentList @('/S', "/D=$installRoot") -Wait -PassThru -WindowStyle Hidden
          if ($installer.ExitCode -ne 0) { throw 'Installer failed' }
          $python = Join-Path $installRoot 'python/python.exe'
          & $python (Join-Path $installRoot 'app/backend/cli.py') demo
          if ($LASTEXITCODE -ne 0) { throw 'Embedded CLI demo failed' }
          & $python scripts/smoke_producer.py
          if ($LASTEXITCODE -ne 0) { throw 'Embedded producer failed' }
          $env:MM_TEST_PYTHON = $python
          $env:MM_TEST_APP = Join-Path $installRoot 'app/backend/app.py'
          npm run e2e
          if ($LASTEXITCODE -ne 0) { throw 'Installed Angular UI / Python service failed' }
          $manifest = Get-Content dist/release.json -Raw | ConvertFrom-Json
          $version = (Get-ItemProperty 'HKCU:/Software/Microsoft/Windows/CurrentVersion/Uninstall/MusicMaker').DisplayVersion
          if ($version -ne $manifest.version) { throw 'Installed version differs from build' }

  gate:
    name: Required checks
    runs-on: ubuntu-latest
    needs: [policy, tooling, quality, frontend, plan, installer, windows-smoke]
    if: always()
    env:
      POLICY: ${{ needs.policy.result }}
      TOOLING: ${{ needs.tooling.result }}
      DOCS: ${{ needs.policy.outputs.docs_only }}
      QUALITY: ${{ needs.quality.result }}
      FRONTEND: ${{ needs.frontend.result }}
      PLAN: ${{ needs.plan.result }}
      VERSION: ${{ needs.plan.outputs.version }}
      INSTALLER: ${{ needs.installer.result }}
      SMOKE: ${{ needs.windows-smoke.result }}
    steps:
      - shell: bash
        run: |
          [[ "$POLICY" == success && "$TOOLING" == success ]] || exit 1
          if [[ "$DOCS" == true ]]; then
            [[ "$QUALITY" == skipped && "$FRONTEND" == skipped && "$PLAN" == skipped && "$INSTALLER" == skipped && "$SMOKE" == skipped ]] || exit 1
          else
            [[ "$QUALITY" == success && "$FRONTEND" == success && "$PLAN" == success ]] || exit 1
            if [[ -n "$VERSION" ]]; then
              [[ "$INSTALLER" == success && "$SMOKE" == success ]] || exit 1
            else
              [[ "$INSTALLER" == skipped && "$SMOKE" == skipped ]] || exit 1
            fi
          fi

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [gate, plan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.gate.result == 'success' && needs.plan.outputs.version != ''
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-installer
          path: dist
      - run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
