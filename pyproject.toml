[project]
name = "musicmaker"
version = "0.0.0" # Development metadata; released installer versions come from semantic-release.
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "pedalboard>=0.9.8",
    "imageio-ffmpeg>=0.5",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.18,<1",
]

[dependency-groups]
dev = [
    "pytest==8.4.2", "ruff==0.14.0", "ty==0.0.86", "uv==0.13.0",
    "pefile==2024.8.26", "packaging==26.3", "pillow==12.3.0", "httpx==0.28.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["scripts/windows/work", "scripts/windows/cache"]
force-exclude = true

[tool.ruff.lint]
# Establish correctness checks without a wholesale rewrite of the original DSP.
select = ["E9", "F"]

[tool.ty.environment]
extra-paths = ["backend"]
