[project]
name = "troglodaw"
version = "0.0.0" # Development metadata; released installer versions come from semantic-release.
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "pedalboard>=0.9.8",
    "imageio-ffmpeg>=0.5",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.18,<1",
]

[project.optional-dependencies]
# Installed explicitly into the selected model folder, never needed by the core DSP/CLI.
inference = [
    "torch==2.7.1", "torchaudio==2.7.1", "torchvision==0.22.1",
    "transformers==4.57.6", "diffusers==0.39.0", "accelerate==1.15.0",
    "loguru==0.7.3", "einops==0.8.2", "numba==0.63.1",
    "vector-quantize-pytorch==1.31.6", "speechbrain==1.0.3",
    "huggingface-hub==0.36.2", "pyyaml==6.0.3", "psutil==7.2.2",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform == 'win32'" }
torchaudio = { index = "pytorch-cu128", marker = "sys_platform == 'win32'" }
torchvision = { index = "pytorch-cu128", marker = "sys_platform == 'win32'" }

[dependency-groups]
dev = [
    "pytest==8.4.2", "ruff==0.14.0", "ty==0.0.86", "uv==0.13.0",
    "pefile==2024.8.26", "packaging==26.3", "pillow==12.3.0", "httpx==0.28.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["scripts/windows/work", "scripts/windows/cache"]
force-exclude = true

[tool.ruff.lint]
# Establish correctness checks without a wholesale rewrite of the original DSP.
select = ["E9", "F"]

[tool.ty.environment]
extra-paths = ["backend"]
